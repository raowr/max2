// protoc --go_out=plugins=grpc:. *.proto

syntax = "proto3";

package action.v1;

option go_package = "api/action/v1;v1";

service Action{
    rpc SendAction(SendActionReq) returns (SendActionRes) {}
}

message SendActionReq {
    string type = 1 [json_name = "type"];
    string data = 2 [json_name = "data"];
    string from = 3 [json_name = "from"];
}
message SendActionRes {}
